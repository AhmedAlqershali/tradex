services:
  - type: web
    name: tradex-backend
    runtime: docker
    rootDir: tradex-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health

    # Render supplies PORT automatically. The Docker image reads it at startup.
    # Do not add a disk here until choosing the paid persistent-disk option;
    # see tradex-backend/RENDER_DEPLOYMENT.md.
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FILESYSTEM_DISK
        value: public
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SANCTUM_EXPIRATION_MINUTES
        value: "129600"