workflows:
  android-release:
    name: Android Release
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      android_signing:
        - tradex-upload-key.jks

    scripts:
      - name: Get Flutter packages
        script: cd flutter_app && flutter pub get

      - name: Build Android App Bundle
        script: |
          cd flutter_app
          flutter build appbundle --release \
            --dart-define=TRADEX_BASE_URL="$TRADEX_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Get Android SHA-1
        script: |
          keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -alias "$CM_KEY_ALIAS" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            | grep -i "SHA1"

    artifacts:
      - flutter_app/build/app/outputs/bundle/release/*.aab
